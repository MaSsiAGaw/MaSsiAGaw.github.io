<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🖤</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-image: url('8b95ecf1bc23de44e274b6284d5e4ba6.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #fff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.9);
    }

    .message {
      width: 90%;
      max-width: 500px;
      text-align: center;
      font-size: 24px;
      line-height: 1.8;
      font-weight: 500;
      background: rgba(0, 0, 0, 0.3);
      padding: 20px;
      border-radius: 15px;
      backdrop-filter: blur(3px);

      opacity: 0;
      animation: appear 2s ease forwards;
      animation-delay: 1s;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="message">
"اللهم اجبر قلبي جبرًا يليق بكرمك، وبدّل كل ما أتعبني راحة، وكل ما أحزنني فرحًا." 🍃🤲
  </div>

</body>
</html>
