<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🖤</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .message {
      width: 90%;
      max-width: 500px;
      text-align: center;
      font-size: 24px;
      line-height: 1.8;
      font-weight: 500;

      opacity: 0;
      animation: appear 2s ease forwards;
      animation-delay: 2s;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="message">
  وقفت معاك نهار كانوا يضحكوا عليك 💔
  </div>

</body>
</html>
